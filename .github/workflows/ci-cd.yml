name: CI/CD Pipeline

on:
  push:
    branches:
      - lab2-mlops-sprint
  pull_request:
    branches:
      - lab2-mlops-sprint

jobs:
  # Проверки кода и тесты
  build-test-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d hr_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- FRONTEND ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint & Format Check
        run: |
          npm run lint --prefix frontend
          npm run format:check --prefix frontend || echo "⚠️ Format issues detected"

      - name: Build frontend
        run: npm run build --prefix frontend

      # ---------- BACKEND ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 black pytest

      - name: Lint and format backend
        run: |
          black --check backend || echo "⚠️ Format issues detected"
          flake8 backend

      - name: Run backend unit tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/hr_db
        run: pytest backend/tests -v --maxfail=1 --disable-warnings

      # ---------- DOCKER BUILD CHECK ----------
      - name: Validate Docker builds
        run: |
          docker compose -f docker-compose.dev.yml config
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.langfuse.yml config
          docker compose -f docker-compose.langfuse.yml build
          docker compose -f monitoring/docker-compose.yml config
          docker compose -f monitoring/docker-compose.yml build

  #Проверка PR 
  pr-checks:
    name: Pull Request Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build-test-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure code formatted
        run: |
          pip install black flake8
          black --check backend
          flake8 backend
          npm run lint --prefix frontend

      - name: Run lightweight backend tests
        run: pytest backend/tests/unit -v

  #Деплой (Dev/Main) 
  deploy-dev:
    name: Deploy to Dev Environment
    needs: build-test-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml push
          docker compose -f docker-compose.langfuse.yml build
          docker compose -f docker-compose.langfuse.yml push
          docker compose -f monitoring/docker-compose.yml build
          docker compose -f monitoring/docker-compose.yml push
      - name: Deploy to Dev Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          echo "${SSH_PRIVATE_KEY}" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ${DEV_USER}@${DEV_HOST} << 'EOF'
            cd ~/ai-hr-assistant
            git pull

            echo "🔁 Проверка Ollama..."
            if ! pgrep -f "ollama serve" > /dev/null; then
              nohup ollama serve > ollama.log 2>&1 &
              sleep 5
            fi

            if ! ollama list | grep -q "llama3"; then
              ollama pull llama3
            fi

            pip install --upgrade fastapi langfuse
            docker compose -f docker-compose.dev.yml up -d --build
          EOF

      - name: Notify Success
        uses: slackapi/slack-github-action@v1.26.0
        if: success()
        with:
          payload: |
            {
              "text": "Успешный деплой AI HR Assistant в Dev окружение!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
