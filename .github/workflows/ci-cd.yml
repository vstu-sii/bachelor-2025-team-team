name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-test-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d hr_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- FRONTEND ----------
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend lint
        run: npm run lint --prefix frontend

      - name: Run frontend build
        run: npm run build --prefix frontend

      # ---------- BACKEND ----------
      - name: Setup Python for backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend lint
        run: |
          pip install flake8 black
          black --check backend
          flake8 backend

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/hr_db
        run: pytest backend/tests -v

    deploy-dev:
    name: Deploy to Dev Environment
    needs: build-test-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml push

      - name: Deploy to dev environment and ensure model
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          echo "${SSH_PRIVATE_KEY}" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ${DEV_USER}@${DEV_HOST} << 'EOF'
            cd ~/ai-hr-assistant
            git pull

            # Проверка и запуск Ollama (если не запущен)
            if ! pgrep -f "ollama serve" > /dev/null; then
              echo "Запуск Ollama..."
              nohup ollama serve > ollama.log 2>&1 &
              sleep 5
            fi

            # Проверяем, есть ли модель
            if ! ollama list | grep -q "llama3"; then
              echo "Модель llama3 не найдена — скачиваем..."
              ollama pull llama3
            else
              echo "Модель llama3 уже установлена."
            fi
            pip install langfuse
            pip install fastapi
            # Поднимаем контейнеры
            docker compose -f docker-compose.dev.yml up -d --build
          EOF

      - name: Notify success
        uses: slackapi/slack-github-action@v1.26.0
        if: success()
        with:
          payload: |
            {
              "text": "Успешный деплой!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

