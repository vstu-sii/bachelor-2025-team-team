<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Questions - AI HR Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .interview-section {
            padding: 60px 0;
            min-height: calc(100vh - 200px);
        }

        .interview-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .interview-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .interview-header h1 {
            font-size: 2.5rem;
            color: #f4d03f;
            margin-bottom: 10px;
        }

        .interview-header p {
            color: #cccccc;
            font-size: 1.1rem;
        }

        .interview-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .interview-card {
            background-color: #3a3a3a;
            padding: 30px;
            border-radius: 12px;
            border-left: 5px solid #f4d03f;
            transition: all 0.3s;
        }

        .interview-card:hover {
            background-color: #424242;
            transform: translateX(5px);
        }

        .interview-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #5a5a5a;
        }

        .interview-header-left {
            flex: 1;
        }

        .interview-title {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 600;
        }

        .interview-meta {
            display: flex;
            gap: 15px;
            color: #888888;
            font-size: 0.9rem;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .questions-count {
            color: #888888;
            font-size: 0.85rem;
        }

        .interview-header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle-questions-btn {
            background-color: transparent;
            color: #f4d03f;
            border: 2px solid #f4d03f;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .toggle-questions-btn:hover {
            background-color: #f4d03f;
            color: #000000;
        }

        .toggle-icon {
            transition: transform 0.3s;
            font-size: 1rem;
        }

        .toggle-icon.collapsed {
            transform: rotate(180deg);
        }

        .questions-content {
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 1;
            margin-top: 20px;
        }

        .questions-content.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .questions-container {
            margin-top: 20px;
        }

        .question-item {
            background-color: #2a2a2a;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 3px solid #5a9bd5;
        }

        .question-number {
            color: #f4d03f;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .question-type-badge {
            background-color: #5a9bd5;
            color: #ffffff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .question-time-badge {
            color: #888888;
            font-size: 0.8rem;
            font-weight: normal;
        }

        .question-text {
            color: #ffffff;
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .question-purpose {
            color: #aaaaaa;
            font-size: 0.85rem;
            font-style: italic;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 2px solid #5a9bd5;
        }

        .expected-answers {
            background-color: #1a1a1a;
            padding: 12px 15px;
            border-radius: 6px;
            margin-top: 12px;
            border-left: 3px solid #4caf50;
        }

        .expected-answers-title {
            color: #4caf50;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .expected-answers-list {
            margin: 0;
            padding-left: 20px;
            color: #cccccc;
            font-size: 0.85rem;
        }

        .expected-answers-list li {
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .expected-answers-list li:last-child {
            margin-bottom: 0;
        }

        .no-questions {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            color: #888888;
            text-align: center;
            font-style: italic;
        }

        .btn-download-questions {
            background-color: #5a9bd5;
            color: #ffffff;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download-questions:hover {
            background-color: #4a8bc5;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #f4d03f;
            font-size: 1.2rem;
        }

        .no-interviews {
            text-align: center;
            padding: 60px 20px;
            color: #888888;
        }

        .no-interviews h2 {
            color: #f4d03f;
            margin-bottom: 10px;
        }

        .score-badge {
            background-color: #f4d03f;
            color: #000000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .download-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #5a5a5a;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/vacancy" class="logo">The best company in the world</a>
            <div style="display: flex; gap: 20px; align-items: center;">
                <span id="userGreeting" style="color: #f4d03f;"></span>
                <a href="#" id="logoutBtn" class="contact-link" style="color: #ff6b6b;">Logout</a>
            </div>
        </header>
    </div>

    <section class="interview-section">
        <div class="container">
            <div class="interview-container">
                <div class="interview-header">
                    <h1>Interview Questions</h1>
                    <p>AI-generated questions for top candidates</p>
                </div>

                <div id="loadingIndicator" class="loading">
                    Loading interview questions...
                </div>

                <div id="interviewList" class="interview-list" style="display: none;"></div>

                <div id="noInterviews" class="no-interviews" style="display: none;">
                    <h2>No interview questions available</h2>
                    <p>Process resumes to generate interview questions</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 The best company in the world. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Проверка авторизации
        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('user');
            if (!user) {
                alert('Необходимо войти в систему');
                window.location.href = '/authorization';
                return;
            }

            const userData = JSON.parse(user);
            document.getElementById('userGreeting').textContent = `Hello, ${userData.username}!`;
            
            // Проверяем наличие выбранной вакансии
            const vacancyId = localStorage.getItem('selectedVacancyId');
            if (!vacancyId) {
                alert('Вакансия не выбрана. Пожалуйста, сначала создайте или выберите вакансию.');
                window.location.href = '/vacancy';
                return;
            }
            
            // Загружаем вопросы для собеседования
            loadInterviewQuestions(vacancyId);
        });

        // Обработка выхода
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            if (confirm('Вы действительно хотите выйти?')) {
                localStorage.removeItem('user');
                await fetch('/logout');
                window.location.href = '/authorization?logout=true';
            }
        });

        // Загрузка вопросов для собеседования
        async function loadInterviewQuestions(vacancyId) {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const interviewList = document.getElementById('interviewList');
            const noInterviews = document.getElementById('noInterviews');

            try {
                const response = await fetch(`/api/interviews/questions?vacancyId=${vacancyId}`);
                const data = await response.json();

                loadingIndicator.style.display = 'none';

                if (data.success && data.interviews.length > 0) {
                    interviewList.style.display = 'flex';
                    displayInterviews(data.interviews);
                } else {
                    noInterviews.style.display = 'block';
                }
            } catch (error) {
                console.error('Ошибка загрузки вопросов:', error);
                loadingIndicator.style.display = 'none';
                noInterviews.style.display = 'block';
            }
        }

        // Отображение вопросов для собеседования
        function displayInterviews(interviews) {
            const interviewList = document.getElementById('interviewList');
            interviewList.innerHTML = '';

            interviews.forEach((interview) => {
                const card = document.createElement('div');
                card.className = 'interview-card';

                let questionsHTML = '<div class="no-questions">No questions available</div>';
                let questionsCount = 0;
                
                if (interview.questions) {
                    try {
                        const questionsData = typeof interview.questions === 'string' 
                            ? JSON.parse(interview.questions) 
                            : interview.questions;
                        
                        // Извлекаем массив вопросов из структуры
                        let questions = [];
                        
                        // Проверяем разные возможные структуры
                        if (Array.isArray(questionsData)) {
                            questions = questionsData;
                        } else if (questionsData.questions && Array.isArray(questionsData.questions)) {
                            questions = questionsData.questions;
                        } else if (questionsData.interview_plan && questionsData.questions) {
                            questions = questionsData.questions;
                        }
                        
                        questionsCount = questions.length;
                        
                        if (questions.length > 0) {
                            questionsHTML = '<div class="questions-container">';
                            questions.forEach((q, index) => {
                                // Извлекаем текст вопроса в зависимости от структуры
                                let questionText = '';
                                let questionType = '';
                                let purpose = '';
                                let timeEstimate = '';
                                let expectedAnswers = [];
                                
                                if (typeof q === 'string') {
                                    questionText = q;
                                } else if (typeof q === 'object') {
                                    questionText = q.question || q.text || JSON.stringify(q);
                                    questionType = q.type || '';
                                    purpose = q.purpose || '';
                                    timeEstimate = q.time_estimate || '';
                                    expectedAnswers = q.expected_answer_indicators || [];
                                }
                                
                                const typeBadge = questionType 
                                    ? `<span class="question-type-badge">${questionType}</span>` 
                                    : '';
                                
                                const timeBadge = timeEstimate 
                                    ? `<span class="question-time-badge">⏱️ ${timeEstimate}</span>`
                                    : '';
                                
                                // Формируем список ожидаемых ответов
                                let expectedAnswersHTML = '';
                                if (expectedAnswers.length > 0) {
                                    expectedAnswersHTML = `
                                        <div class="expected-answers">
                                            <div class="expected-answers-title">✓ Expected answer indicators:</div>
                                            <ul class="expected-answers-list">
                                                ${expectedAnswers.map(indicator => 
                                                    `<li>${indicator}</li>`
                                                ).join('')}
                                            </ul>
                                        </div>
                                    `;
                                }
                                
                                // Формируем описание цели вопроса
                                let purposeHTML = '';
                                if (purpose) {
                                    purposeHTML = `<div class="question-purpose">💡 Purpose: ${purpose}</div>`;
                                }
                                
                                questionsHTML += `
                                    <div class="question-item">
                                        <div class="question-number">
                                            Question ${index + 1}
                                            ${typeBadge}
                                            ${timeBadge}
                                        </div>
                                        <div class="question-text">${questionText}</div>
                                        ${purposeHTML}
                                        ${expectedAnswersHTML}
                                    </div>
                                `;
                            });
                            questionsHTML += '</div>';
                        }
                    } catch (e) {
                        console.error('Error parsing questions:', e);
                        console.error('Raw questions data:', interview.questions);
                    }
                }

                card.innerHTML = `
                    <div class="interview-card-header">
                        <div class="interview-header-left">
                            <div class="interview-title">Resume #${interview.resume_id}</div>
                            <div class="interview-meta">
                                <span>📊 Score: <strong>${interview.score || 'N/A'}</strong></span>
                                <span>🎯 Vacancy #${interview.vacancy_id}</span>
                                <span class="questions-count">📋 ${questionsCount} question(s)</span>
                            </div>
                        </div>
                        <div class="interview-header-actions">
                            <div class="score-badge">${interview.score || 0} points</div>
                            <button class="toggle-questions-btn" onclick="toggleQuestions(${interview.resume_id})">
                                <span class="toggle-text">Show Questions</span>
                                <span class="toggle-icon collapsed">▼</span>
                            </button>
                        </div>
                    </div>
                    <div class="questions-content collapsed" id="questions-${interview.resume_id}">
                        ${questionsHTML}
                        <div class="download-section">
                            <button class="btn-download-questions" onclick="downloadQuestions(${interview.resume_id})">
                                📥 Download Questions
                            </button>
                        </div>
                    </div>
                `;

                interviewList.appendChild(card);
            });
        }

        // Функция сворачивания/разворачивания вопросов
        function toggleQuestions(resumeId) {
            const questionsContent = document.getElementById(`questions-${resumeId}`);
            const card = questionsContent.closest('.interview-card');
            const toggleBtn = card.querySelector('.toggle-questions-btn');
            const toggleIcon = toggleBtn.querySelector('.toggle-icon');
            const toggleText = toggleBtn.querySelector('.toggle-text');
            
            if (questionsContent.classList.contains('collapsed')) {
                // Разворачиваем
                questionsContent.classList.remove('collapsed');
                toggleIcon.classList.remove('collapsed');
                toggleText.textContent = 'Hide Questions';
            } else {
                // Сворачиваем
                questionsContent.classList.add('collapsed');
                toggleIcon.classList.add('collapsed');
                toggleText.textContent = 'Show Questions';
            }
        }

        // Скачивание вопросов в текстовый файл
        function downloadQuestions(resumeId) {
            // Находим карточку с вопросами
            const cards = document.querySelectorAll('.interview-card');
            let questionsText = `Interview Questions for Resume #${resumeId}\n`;
            questionsText += `Generated: ${new Date().toLocaleString()}\n`;
            questionsText += '='.repeat(70) + '\n\n';

            cards.forEach(card => {
                const title = card.querySelector('.interview-title').textContent;
                if (title.includes(`#${resumeId}`)) {
                    const questions = card.querySelectorAll('.question-item');
                    questions.forEach((q, index) => {
                        const numberElement = q.querySelector('.question-number');
                        const text = q.querySelector('.question-text').textContent;
                        const purposeElement = q.querySelector('.question-purpose');
                        const expectedAnswersElement = q.querySelector('.expected-answers-list');
                        
                        // Извлекаем тип вопроса
                        const typeBadge = q.querySelector('.question-type-badge');
                        const type = typeBadge ? typeBadge.textContent : '';
                        
                        // Извлекаем время
                        const timeBadge = q.querySelector('.question-time-badge');
                        const time = timeBadge ? timeBadge.textContent.replace('⏱️ ', '') : '';
                        
                        questionsText += `${index + 1}. ${text}\n`;
                        
                        if (type) {
                            questionsText += `   Type: ${type}\n`;
                        }
                        
                        if (time) {
                            questionsText += `   Time estimate: ${time}\n`;
                        }
                        
                        if (purposeElement) {
                            const purpose = purposeElement.textContent.replace('💡 Purpose: ', '');
                            questionsText += `   Purpose: ${purpose}\n`;
                        }
                        
                        if (expectedAnswersElement) {
                            const indicators = Array.from(expectedAnswersElement.querySelectorAll('li'))
                                .map(li => li.textContent);
                            questionsText += `   Expected answer indicators:\n`;
                            indicators.forEach(indicator => {
                                questionsText += `   - ${indicator}\n`;
                            });
                        }
                        
                        questionsText += '\n';
                    });
                }
            });

            // Создаем и скачиваем файл
            const blob = new Blob([questionsText], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `interview_questions_resume_${resumeId}.txt`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        // Глобальные функции
        window.toggleQuestions = toggleQuestions;
        window.downloadQuestions = downloadQuestions;
    </script>
</body>
</html>
