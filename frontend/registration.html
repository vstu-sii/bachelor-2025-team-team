<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI HR Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="logo">The best company in the world</a>
            <a href="#contact" class="contact-link">Contact</a>
        </header>
    </div>

    <main>
        <div class="signin-container">
            <div class="signin-header">
                <h1>Sign Up</h1>
                <p>Join AI HR Assistant today</p>
            </div>

            <form class="signin-form" id="signupForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Choose a username"
                        required
                        minlength="3"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Create a password"
                        required
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password"
                        required
                        minlength="8"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Create Account</button>
                </div>

                <div class="form-footer">
                    Already have an account? <a href="/authorization">Sign In</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="signin-footer">
        <div class="container">
            <p>&copy; 2024 The best company in the world. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Обработка формы регистрации
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Получение данных из формы
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Валидация совпадения паролей
            if (password !== confirmPassword) {
                alert('Пароли не совпадают!');
                return;
            }

            // Проверка длины username
            if (username.length < 3) {
                alert('Имя пользователя должно содержать минимум 3 символа!');
                return;
            }

            // Проверка длины пароля
            if (password.length < 8) {
                alert('Пароль должен содержать минимум 8 символов!');
                return;
            }

            // Показываем процесс загрузки
            const submitButton = document.querySelector('.btn-submit');
            const originalText = submitButton.textContent;
            submitButton.textContent = 'Creating Account...';
            submitButton.disabled = true;

            try {
                // Отправка POST запроса на сервер
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Успешная регистрация
                    alert(`${data.message}\nWelcome, ${username}!`);
                    
                    // Перенаправление на страницу авторизации
                    window.location.href = '/authorization';
                } else {
                    // Ошибка регистрации
                    alert(data.message);
                    
                    // Возвращаем кнопку в исходное состояние
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка соединения с сервером. Попробуйте позже.');
                
                // Возвращаем кнопку в исходное состояние
                submitButton.textContent = originalText;
                submitButton.disabled = false;
            }
        });

        // Визуальная индикация совпадения паролей
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        confirmPasswordInput.addEventListener('input', function() {
            if (confirmPasswordInput.value === '') {
                confirmPasswordInput.style.borderColor = '#5a5a5a';
            } else if (passwordInput.value === confirmPasswordInput.value) {
                confirmPasswordInput.style.borderColor = '#4CAF50';
            } else {
                confirmPasswordInput.style.borderColor = '#f44336';
            }
        });

        // Проверка, если пользователь уже авторизован
        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('user');
            if (user) {
                const userData = JSON.parse(user);
                const confirmRedirect = confirm(`Вы уже авторизованы как ${userData.username}. Перейти на главную страницу?`);
                if (confirmRedirect) {
                    window.location.href = '/';
                }
            }
        });
    </script>
</body>
</html>
