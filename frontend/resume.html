<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resumes - AI HR Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .upload-section {
            padding: 60px 0;
            min-height: calc(100vh - 200px);
        }

        .upload-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .drop-zone {
            background-color: #2a2a2a;
            border: 3px dashed #5a5a5a;
            border-radius: 12px;
            padding: 80px 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .drop-zone.dragover {
            border-color: #f4d03f;
            background-color: #333333;
        }

        .drop-zone-text {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .drop-zone-icon {
            font-size: 3rem;
            color: #f4d03f;
            margin-bottom: 20px;
        }

        .download-btn {
            background-color: #000000;
            color: #ffffff;
            padding: 12px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background-color: #f4d03f;
            color: #000000;
            transform: translateY(-2px);
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            background-color: #3a3a3a;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-name {
            color: #ffffff;
        }

        .file-remove {
            background-color: #ff6b6b;
            color: #ffffff;
            border: none;
            padding: 6px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .file-remove:hover {
            background-color: #ff5252;
        }

        #fileInput {
            display: none;
        }

        .submit-section {
            text-align: center;
            margin-top: 40px;
        }

        .btn-submit {
            background-color: #000000;
            color: #ffffff;
            padding: 16px 60px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #f4d03f;
            color: #000000;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background-color: #5a5a5a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a class="logo">The best company in the world</a>
            <div style="display: flex; gap: 20px; align-items: center;">
                <span id="userGreeting" style="color: #f4d03f;"></span>
                <a href="#" id="logoutBtn" class="contact-link" style="color: #ff6b6b;">Logout</a>
            </div>
        </header>
    </div>

    <section class="upload-section">
        <div class="container">
            <div class="upload-container">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-icon">📁</div>
                    <div class="drop-zone-text">Drag and drop PDF files to upload</div>
                    <button type="button" class="download-btn" id="browseBtn">Browse Files</button>
                </div>

                <input type="file" id="fileInput" multiple accept=".pdf">

                <div class="file-list" id="fileList"></div>

                <div class="submit-section">
                    <button class="btn-submit" id="submitBtn" disabled>Upload Resumes</button>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 The best company in the world. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Проверка авторизации
        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('user');
            if (!user) {
                alert('Необходимо войти в систему');
                window.location.href = '/authorization';
                return;
            }

            const userData = JSON.parse(user);
            document.getElementById('userGreeting').textContent = `Hello, ${userData.username}!`;
        });

        // Обработка выхода
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            if (confirm('Вы действительно хотите выйти?')) {
                localStorage.removeItem('user');
                await fetch('/logout');
                window.location.href = '/authorization?logout=true';
            }
        });

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const fileList = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');
        
        let selectedFiles = [];

        // Открыть диалог выбора файлов
        browseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Обработка выбранных файлов
        function handleFiles(files) {
            for (let file of files) {
                // Валидация: только PDF
                if (file.type !== 'application/pdf') {
                    alert(`Файл "${file.name}" не является PDF файлом!`);
                    continue;
                }

                // Проверка размера (макс 10MB)
                if (file.size > 10 * 1024 * 1024) {
                    alert(`Файл "${file.name}" слишком большой. Максимум: 10MB`);
                    continue;
                }

                // Добавляем файл, если его еще нет
                if (!selectedFiles.some(f => f.name === file.name)) {
                    selectedFiles.push(file);
                }
            }
            updateFileList();
        }

        // Обновление списка файлов
        function updateFileList() {
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span class="file-name">📄 ${file.name} (${formatSize(file.size)})</span>
                    <button class="file-remove" onclick="removeFile(${index})">Remove</button>
                `;
                fileList.appendChild(item);
            });
            submitBtn.disabled = selectedFiles.length === 0;
        }

        // Удаление файла из списка
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // Форматирование размера файла
        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Загрузка на сервер
        submitBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('resumes', file);
            });

            submitBtn.textContent = 'Uploading...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/resumes/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    alert('Резюме успешно загружены!');
                    // Переход на страницу рейтинга
                    window.location.href = '/ranking';
                } else {
                    alert('Ошибка: ' + data.message);
                    submitBtn.textContent = 'Upload Resumes';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка соединения с сервером');
                submitBtn.textContent = 'Upload Resumes';
                submitBtn.disabled = false;
            }
        });

        // Глобальная функция для удаления
        window.removeFile = removeFile;
    </script>
</body>
</html>
