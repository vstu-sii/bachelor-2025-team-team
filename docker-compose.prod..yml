  model_server:
    build:
      ./backend/routers  # путь к папке с Dockerfile для модели
    ports:
      - "8000:8000"
    environment:
      - ENV_VAR=значение  
    volumes:
      - ./model_server:/app
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: your_password
      MYSQL_DATABASE: SII
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
