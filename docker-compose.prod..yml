version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend/routers:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:3000"
    environment:
     # - DATABASE_URL=postgresql://user:password@db:5432/hr_db
      - LLM_URL=http://llm-service:5000
      - LANGFUSE_PUBLIC_KEY=dev_public_key
      - LANGFUSE_SECRET_KEY=dev_secret_key
      - LANGFUSE_HOST=http://langfuse:8080
      - DISABLE_WORKER=1
    depends_on:
      - db
      #- llm-service
